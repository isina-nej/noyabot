name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Default CI uses SQLite and needs NO Telegram/AI secrets. Live Telegram
    # tests are manual and are not run here; the concurrent-lock test
    # (ConcurrentConfirmationTests) auto-skips on SQLite. To cover it, add a
    # MySQL service and set DB_* env vars (see README).
    env:
      DEBUG: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Verify migrations are complete
        run: python manage.py makemigrations --check --dry-run

      - name: Compile all sources
        run: python -m compileall botapp config

      - name: Run test suite
        run: python manage.py test

  mysql-concurrency:
    runs-on: ubuntu-latest
    # SQLite does not implement SELECT FOR UPDATE. Exercise the real MySQL
    # row-lock confirmation test on every push/PR before production deployment.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_only
          MYSQL_DATABASE: noyabot_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci_root_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DEBUG: "true"
      DB_ENGINE: django.db.backends.mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ci_root_only
      DB_NAME: noyabot_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run MySQL locking and inbox isolation regressions
        run: python manage.py test botapp.test_agent.ConcurrentConfirmationTests botapp.test_bot_inbox

  static-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff and pip-audit
        run: pip install ruff==0.14.3 pip-audit==2.9.0
      - name: Check Python correctness
        run: ruff check botapp config --select E7,E9,F63,F7,F82
      - name: Audit dependency vulnerabilities
        run: pip-audit -r requirements.txt --progress-spinner off
