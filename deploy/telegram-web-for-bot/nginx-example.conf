# Replace example.org and TLS/certificate paths. Do NOT expose without auth.
# Both web UIs can live under the same private HTTPS origin if your
# application has a reverse-proxy route to Django's WSGI service.
server {
    listen 443 ssl;
    server_name example.org;
    ssl_certificate /etc/letsencrypt/live/example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.org/privkey.pem;

    auth_basic "Private bot inbox";
    auth_basic_user_file /etc/nginx/.noya-inbox-htpasswd;

    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;

    location /inbox/ {
        proxy_pass http://127.0.0.1:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
    # The shared Django login endpoint is required for staff sessions.
    location /admin/ {
        proxy_pass http://127.0.0.1:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /static/ {
        # If Django admin static files are collected and hosted separately:
        alias /opt/noyabot/staticfiles/;
    }
    location / {
        proxy_pass http://127.0.0.1:8431;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
