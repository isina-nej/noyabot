# Example only: use TWO independent origins to isolate the upstream JS
# (which stores a bot MTProto session/token in browser storage) from Django
# administrative session cookies and CSRF tokens.
# Replace domains, TLS paths, and htpasswd files before deployment.
server {
    listen 443 ssl;
    server_name botweb.example.org;
    ssl_certificate /etc/letsencrypt/live/botweb.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/botweb.example.org/privkey.pem;

    auth_basic "Private Telegram bot client";
    auth_basic_user_file /etc/nginx/.noya-webbot-htpasswd;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass http://127.0.0.1:8431;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}

server {
    listen 443 ssl;
    server_name inbox.example.org;
    ssl_certificate /etc/letsencrypt/live/inbox.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inbox.example.org/privkey.pem;

    auth_basic "Noya staff inbox";
    auth_basic_user_file /etc/nginx/.noya-staff-htpasswd;

    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;

    location /inbox/ {
        proxy_pass http://127.0.0.1:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /admin/ {
        proxy_pass http://127.0.0.1:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /static/ {
        alias /opt/noyabot/staticfiles/;
    }
}
